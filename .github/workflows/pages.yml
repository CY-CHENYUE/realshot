name: Deploy the playable game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Assemble the static site
        run: |
          mkdir -p _site/three/build _site/three/examples
          cp level.html armory.html dev-crowd.html dev-props.html _site/
          cp level.html _site/index.html
          cp -R src _site/src
          cp -R assets _site/assets
          rm -rf _site/assets/readme
          # server.mjs maps /three/ to node_modules/three; the site carries the same files
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js _site/three/build/
          cp -R node_modules/three/examples/jsm _site/three/examples/jsm
          cp node_modules/three/LICENSE _site/three/LICENSE
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
