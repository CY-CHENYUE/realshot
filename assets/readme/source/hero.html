<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>RealShot · 雪线行动</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:840px;background:#090d14;overflow:hidden}
/* drawn on an 1800 x 1260 stage and scaled to the 1200 x 840 canvas; render at device scale 2 for the published 2400 x 1680 image */
#stage{position:absolute;left:0;top:0;width:1800px;height:1260px;transform:scale(.666667);transform-origin:0 0}
body{position:relative;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;font-weight:500;color:#fff;-webkit-font-smoothing:antialiased}
.din{font-family:"DIN Alternate","DIN Condensed","Helvetica Neue",sans-serif;font-weight:700}
.cond{font-family:"DIN Condensed","DIN Alternate","Helvetica Neue",sans-serif;font-weight:700}

/* key art: one frame of the game, recorded with the in-game cinematic camera */
#art{position:absolute;left:0;top:0;width:1800px;height:900px;overflow:hidden}
#art img{position:absolute;left:0;top:-112px;width:2088px;height:1174.5px;display:block}
#art:before,#art:after{content:"";position:absolute;inset:0;z-index:1}
#art:before{background:linear-gradient(90deg,rgba(6,10,18,.95) 0%,rgba(6,10,18,.86) 22%,rgba(6,10,18,.46) 41%,rgba(6,10,18,0) 58%)}
#art:after{background:linear-gradient(0deg,#090d14 0%,rgba(9,13,20,.72) 9%,rgba(9,13,20,0) 30%),linear-gradient(180deg,rgba(6,10,18,.42) 0%,rgba(6,10,18,0) 16%)}

.tag{position:absolute;z-index:3;display:flex;align-items:center;gap:12px;font-size:21px;letter-spacing:.24em;color:rgba(255,255,255,.86);text-shadow:0 1px 10px rgba(0,0,0,.55)}
.tag i{width:9px;height:9px;border-radius:50%;background:#ff7a2c}
#art .tag{right:60px;top:44px}

#title{position:absolute;z-index:3;left:108px;top:190px;width:900px}
.eyebrow{display:flex;align-items:center;gap:22px;font-size:24px;letter-spacing:.42em;color:#ff7a2c}
.eyebrow u{display:block;width:64px;height:2px;background:rgba(255,255,255,.4)}
.eyebrow span{color:rgba(255,255,255,.74)}
h1{margin:30px 0 0 2px;height:172px}
h1 img{display:block;height:172px;filter:drop-shadow(0 8px 30px rgba(0,0,0,.5))}
.rule{width:104px;height:7px;background:#ff7a2c;margin:26px 0 30px 6px}
.lead{margin-left:6px;font-size:41px;line-height:1.5;color:rgba(255,255,255,.94);text-shadow:0 2px 18px rgba(0,0,0,.5)}
.lead b{font-weight:600;color:#fff}
.stats{display:flex;gap:56px;margin:44px 0 0 6px}
.stats div{display:flex;align-items:baseline;gap:12px}
.stats b{font-size:86px;line-height:1;letter-spacing:.01em}
.stats span{font-size:25px;color:rgba(255,255,255,.78);letter-spacing:.04em}

/* the three deliverables */
#cards{position:absolute;z-index:4;left:60px;right:60px;top:846px;display:flex;gap:24px}
.card{position:relative;flex:1;height:354px;border-radius:8px;overflow:hidden;background:#111722;box-shadow:0 0 0 1.5px rgba(255,255,255,.13),0 18px 50px rgba(0,0,0,.5)}
.pic{position:relative;height:238px;overflow:hidden}
.pic img{position:absolute;left:0;width:100%;display:block}
.pic .tag{right:16px;top:14px;font-size:17px;gap:9px;padding:6px 12px 6px 11px;background:rgba(6,10,18,.62);border-radius:4px;text-shadow:none}
.pic .tag i{width:7px;height:7px}
.cmd{position:absolute;left:16px;top:14px;z-index:3;padding:7px 13px;border-radius:4px;background:rgba(6,10,18,.74);font:500 19px/1.2 "SF Mono",Menlo,monospace;color:#fff}
.cmd b{color:#ff7a2c;font-weight:500}
.txt{height:116px;padding:17px 24px 0;border-top:1.5px solid rgba(255,255,255,.1)}
.name{display:flex;align-items:baseline;gap:16px;font-size:35px;font-weight:600;letter-spacing:.03em}
.name b{font-size:44px;color:#ff7a2c;line-height:1}
.desc{margin-top:7px;font-size:24px;color:rgba(255,255,255,.74);white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
<div id="art">
  <img src="../screens/key-art.jpg" alt="">
  <div class="tag"><i></i>游戏画面</div>
</div>
<div id="title">
  <div class="eyebrow din">REALSHOT<u></u><span>OPERATION SNOWLINE</span></div>
  <h1><img src="title.svg" alt="雪线行动"></h1>
  <div class="rule"></div>
  <p class="lead"><b>一句话生成模型</b>，做成一款能装进<br><b>透明屏盒子</b>的 3D 射击游戏</p>
  <div class="stats">
    <div><b class="cond">17</b><span>个 Lux3D 模型</span></div>
    <div><b class="cond">36</b><span>轮迭代</span></div>
    <div><b class="cond">4</b><span>天</span></div>
  </div>
</div>
<div id="cards">
  <div class="card">
    <div class="pic"><img src="../screens/card-game.jpg" alt="" style="top:-52px"><div class="tag"><i></i>游戏画面</div></div>
    <div class="txt"><div class="name"><b class="cond">01</b>游戏</div><div class="desc">浏览器第一人称射击 · 四段山谷 · Boss 战</div></div>
  </div>
  <div class="card">
    <div class="pic"><img src="../screens/card-models.jpg" alt="" style="top:-58px"><div class="cmd"><b>$</b> aholo lux3d text-to-3d</div><div class="tag"><i></i>模型渲染</div></div>
    <div class="txt"><div class="name"><b class="cond">02</b>aholo-cli</div><div class="desc">一条命令调用群核 Lux3D 生成模型 · 开源</div></div>
  </div>
  <div class="card">
    <div class="pic"><img src="../screens/card-box.jpg" alt="" style="top:0"><div class="tag"><i></i>实拍</div></div>
    <div class="txt"><div class="name"><b class="cond">03</b>透明屏盒子</div><div class="desc">3D 打印外壳 + 透明屏 · 实物站在画面后面</div></div>
  </div>
</div>
</div>
</body>
</html>
